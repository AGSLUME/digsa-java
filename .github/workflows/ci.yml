# Suite DIGSA · integración continua (orquestador principal). Equivalente: azure-pipelines.yml.
# Cada paso solo llama a ci/*.sh: la lógica vive en el repositorio y cambiar de orquestador no toca los scripts.
#
# Trabajos y puertas (docs/especificaciones/despliegue-carga, parte A):
#   1 secretos · 2 backend · 3 frontend · 5 dependencias   → en paralelo
#   4 e2e (Chromium) ← 3        6 imagen ← 2, 3
#   7 publicar ← 1 a 6, solo push a main y etiquetas v*      8 respaldo ← 6, solo de noche y en etiquetas v*
#   Firefox y WebKit: de noche y en etiquetas v*.
# Para que un trabajo en rojo bloquee la fusión, en Settings → Branches → main se exigen como «required status checks»:
# secretos, backend, frontend, e2e, dependencias e imagen.
# Acciones fijas por SHA (con su versión al lado); Dependabot las propone actualizar.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "30 7 * * *" # 02:30 en Bogotá
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TZ: America/Bogota
  DIGSA_ARTEFACTOS: ${{ github.workspace }}/artefactos

jobs:
  secretos:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: bash ci/secretos.sh
        env:
          # En una solicitud de cambio, solo sus commits; en main, etiquetas y de noche, toda la historia
          DIGSA_SECRETOS_BASE: ${{ github.event.pull_request.base.sha }}
      - name: Informe de gitleaks (sin valores)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secretos
          path: artefactos/secretos/
          retention-days: 30
          if-no-files-found: ignore

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvnw verify (PostgreSQL 16 embebido)
        run: bash ci/backend.sh
      - name: Informes JUnit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-junit
          path: |
            backend/*/target/surefire-reports/
            backend/*/target/failsafe-reports/
          retention-days: 30
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Tipos, Vitest y compilación
        run: bash ci/frontend.sh
      - name: SPA compilada (para e2e)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1
      - name: Informe de Vitest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-vitest
          path: frontend/test-results/
          retention-days: 30
          if-no-files-found: ignore

  e2e:
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Playwright (Chromium)
        run: bash ci/e2e.sh
        env:
          DIGSA_E2E_MOTORES: chromium
      - name: Informe de Playwright (trazas y videos solo de las fallidas)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-chromium
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 30
          if-no-files-found: ignore

  e2e-otros-motores:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        motor: [firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Playwright (${{ matrix.motor }})
        run: bash ci/e2e.sh
        env:
          DIGSA_E2E_MOTORES: ${{ matrix.motor }}
      - name: Informe de Playwright
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-${{ matrix.motor }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 30
          if-no-files-found: ignore

  dependencias:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Trivy (pom.xml y package-lock.json) y npm audit
        run: bash ci/dependencias.sh
      - name: Informe de Trivy
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-dependencias
          path: artefactos/trivy/
          retention-days: 90
          if-no-files-found: ignore

  imagen:
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Construcción, prueba de humo, Trivy y SBOM
        run: bash ci/imagen.sh
        env:
          DIGSA_ORIGEN: ${{ github.server_url }}/${{ github.repository }}
      - name: Imagen probada (para publicar y para la prueba de respaldo)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: imagen
          path: |
            artefactos/imagen/digsa-suite.tar
            artefactos/imagen/digsa-suite.tar.sha256
            artefactos/imagen/imagen.env
            artefactos/imagen/sbom.cdx.json
          retention-days: 3
          compression-level: 0
      - name: SBOM e informe de Trivy de la imagen
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-y-trivy-imagen
          path: |
            artefactos/imagen/sbom.cdx.json
            artefactos/trivy/
          retention-days: 90
          if-no-files-found: ignore

  publicar:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [secretos, backend, frontend, e2e, dependencias, imagen]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Entorno con aprobación: sus secretos (si el registro no es GHCR) no llegan a ninguna otra parte del pipeline
    environment: publicacion
    permissions:
      contents: write # release con el paquete para TI (etiquetas v*)
      packages: write # GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: imagen
          path: artefactos/imagen
      - name: Publicar la imagen probada (y el paquete en etiquetas v*)
        run: bash ci/publicar.sh
        env:
          DIGSA_REGISTRO: ${{ vars.DIGSA_REGISTRO || format('ghcr.io/{0}/digsa-suite', github.repository_owner) }}
          DIGSA_REGISTRO_USUARIO: ${{ secrets.DIGSA_REGISTRO_USUARIO || github.actor }}
          DIGSA_REGISTRO_CLAVE: ${{ secrets.DIGSA_REGISTRO_CLAVE || secrets.GITHUB_TOKEN }}
      - name: Registro de la publicación
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publicacion
          path: artefactos/publicacion/
          retention-days: 90
      - name: Release con el paquete para TI (se conserva mientras dure el contrato)
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$GITHUB_REF_NAME" artefactos/paquete/* --verify-tag --title "Suite DIGSA $GITHUB_REF_NAME" --notes-file artefactos/publicacion/imagen_publicada.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  respaldo:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: imagen
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: imagen
          path: artefactos/imagen
      - name: Respaldo, destrucción de volúmenes y restauración (docker/respaldar.sh y docker/restaurar.sh)
        run: bash ci/respaldo_restauracion.sh
      - name: Bitácora y conteos de la prueba
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: respaldo
          path: artefactos/respaldo/
          retention-days: 90
          if-no-files-found: ignore
