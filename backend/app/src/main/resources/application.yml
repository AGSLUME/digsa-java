# Suite DIGSA · configuración. Ningún secreto aquí: llegan por variables de entorno (en Azure, desde Key Vault).
spring:
  application:
    name: digsa
  autoconfigure:
    # Sin el usuario en memoria que Spring Boot crea por defecto (imprime su contraseña en el log)
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DIGSA_DB_URL:jdbc:postgresql://localhost:5432/digsa}
    username: ${DIGSA_DB_USUARIO:digsa_app}
    password: ${DIGSA_DB_CLAVE:}
    hikari:
      maximum-pool-size: ${DIGSA_DB_POOL:20}
      connection-timeout: 10000
      leak-detection-threshold: 60000   # una conexión retenida más de 60 s queda en el registro (fugas)
  flyway:
    locations: classpath:db/migration
    # Rol dueño de las tablas para migrar; la aplicación usa digsa_app con permisos mínimos (V2). Vacío = el mismo de la aplicación (local)
    user: ${DIGSA_DB_MIGRACION_USUARIO:${spring.datasource.username}}
    password: ${DIGSA_DB_MIGRACION_CLAVE:${spring.datasource.password}}
    placeholders:
      rol_app: ${DIGSA_DB_ROL_APP:}
  session:
    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION
    timeout: 30m
  jackson:
    time-zone: America/Bogota
    default-property-inclusion: always
  servlet:
    multipart:
      max-file-size: 110MB
      max-request-size: 120MB
      file-size-threshold: 2MB
  mail:
    host: ${DIGSA_SMTP_HOST:}
    port: ${DIGSA_SMTP_PUERTO:587}
    username: ${DIGSA_SMTP_USUARIO:}
    password: ${DIGSA_SMTP_CLAVE:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 30000
      mail.smtp.writetimeout: 60000
      mail.smtp.sendpartial: true   # entrega a los destinatarios válidos aunque otro sea rechazado; el adaptador informa quién no lo recibió
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  # IP real desde X-Forwarded-For solo a través de proxies de confianza: por defecto Tomcat confía en los rangos privados
  # (ingress o balanceador interno); otro rango se fija con server.tomcat.remoteip.internal-proxies
  forward-headers-strategy: native
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict

management:
  health:
    mail:
      enabled: false   # una caída del correo no debe marcar la aplicación como caída (se reiniciaría); cada envío reporta su resultado
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      # /actuator/health/liveness y /readiness (healthcheck de la imagen y orquestadores), también fuera de Kubernetes
      probes:
        enabled: true

digsa:
  url: ${DIGSA_URL:http://localhost:8080/}
  entorno: ${DIGSA_ENTORNO:produccion}
  sesion-minutos: ${DIGSA_SESION_MINUTOS:10}
  clave-vigencia-dias: ${DIGSA_CLAVE_VIGENCIA_DIAS:30}
  correo:
    modo: ${DIGSA_CORREO_MODO:smtp}
    remitente: ${DIGSA_CORREO_REMITENTE:}
    nombre-remitente: Suite DIGSA
    carpeta: ${DIGSA_CORREO_CARPETA:almacen/correos}
  captcha:
    clave-sitio: ${DIGSA_TURNSTILE_SITIO:}
    clave-secreta: ${DIGSA_TURNSTILE_SECRETA:}
  reportes:
    correo-defecto: ${DIGSA_CORREO_REPORTES:}
    dominios-permitidos: ${DIGSA_DOMINIOS_REPORTES:}
  archivos:
    carpeta: ${DIGSA_ARCHIVOS_CARPETA:almacen/archivos}
  # SMS de las alertas críticas (GMI P77 b): archivo (solo local) | ninguno (local y pruebas) | el proveedor que se contrate.
  # En producción sin proveedor la aplicación no arranca.
  sms:
    modo: ${DIGSA_SMS_MODO:ninguno}
  # Bandeja de salida: el envío es inmediato al confirmar; esto es el respaldo (reintentos, colgados, otras réplicas)
  salida:
    intervalo-ms: ${DIGSA_SALIDA_INTERVALO_MS:15000}
    hilos: 2
  # Verificación de salud de la base y el almacén (alerta almacen_no_disponible)
  salud:
    intervalo-ms: ${DIGSA_SALUD_INTERVALO_MS:30000}
  exportacion:
    limite-minutos: ${DIGSA_EXPORTACION_LIMITE_MINUTOS:10}   # tiempo máximo de la generación del ZIP (AGS-75 / GMI P74)
    vigencia-horas: ${DIGSA_EXPORTACION_VIGENCIA_HORAS:24}   # luego la limpieza borra el ZIP (datos personales, Ley 1581)
  # --- Analítica (rama analitica) ---
  # Ingesta del insumo del OPL (docs/especificaciones/analitica-ingesta). La clave del seudónimo de los pacientes llega de Key Vault;
  # en producción sin ella la aplicación no arranca (ValidacionArranqueAnalitica); en los demás entornos (salvo local) arranca pero
  # rechaza todo cargue hasta que se configure. Rotación: ver PropiedadesAnalitica.
  analitica:
    clave-seudonimo: ${DIGSA_ANALITICA_CLAVE_SEUDONIMO:}
    parte-max-mb: ${DIGSA_ANALITICA_PARTE_MAX_MB:50}             # partes de la subida (no se toca el multipart global)
    archivo-max-mb: ${DIGSA_ANALITICA_ARCHIVO_MAX_MB:4096}       # archivo completo y contenido descomprimido de .gz y .zip
    conservar-dias: ${DIGSA_ANALITICA_CONSERVAR_DIAS:365}        # original en el almacén (solo ADMINISTRADOR); luego se borra
    umbral-mal-formadas: ${DIGSA_ANALITICA_UMBRAL_MAL_FORMADAS:1} # % de filas con otro número de campos que rechaza el archivo
    lote-validacion: 250000
    max-registros-lote: 50000                                    # servicio web del OPL
    horas-abandono: ${DIGSA_ANALITICA_HORAS_ABANDONO:24}         # cargue abierto sin actividad: vence y se descarta (Ley 1581)
    celda-max-kb: 64                                             # celda y registro del CSV: más es una comilla sin cerrar
    registro-max-kb: 1024
    cuerpo-ws-max-mb: 64                                         # cuerpo de un lote del servicio web (más: 413)
    textos-xlsx-max-mb: 256                                      # textos compartidos de un xlsx sin comprimir (van a memoria)
    cargues-abiertos-max: 3                                      # cargues en subida o mapeo por usuario
    abandono-cron: "0 15 * * * *"                                # cada hora: vence los cargues abiertos sin actividad
    # --- Tableros (A3, analitica-tableros; PropiedadesTableros) ---
    tableros:
      tiempo-maximo-segundos: ${DIGSA_ANALITICA_TIEMPO_MAXIMO_SEGUNDOS:170} # presupuesto de la PETICIÓN (A5 2.7: ver en ≤ 3 min)
      tiempo-maximo-descarga-segundos: ${DIGSA_ANALITICA_TIEMPO_MAXIMO_DESCARGA_SEGUNDOS:570} # descargas (2.7: ≤ 10 min)
      percentil-alto-costo: ${DIGSA_ANALITICA_PERCENTIL_ALTO_COSTO:99}       # gasto por paciente en 12 meses móviles
      poliformulado-minimo: ${DIGSA_ANALITICA_POLIFORMULADO_MINIMO:5}        # principios activos distintos en el mes
      horas-rezago: 48                                                       # aviso «Datos con más de 48 h» (GMI P75)
      max-registros-traza: ${DIGSA_ANALITICA_MAX_REGISTROS_TRAZA:100000}     # CSV de registros de origen (más: 422, nunca truncado)
      registros-por-pagina: 50
      supresion-minima: ${DIGSA_ANALITICA_SUPRESION_MINIMA:0}              # celdas con menos de k pacientes (0 = desactivado; lo decide la DIGSA)
      memoria-trabajo-mb: ${DIGSA_ANALITICA_WORK_MEM_MB:128}               # work_mem de las consultas de analítica
      paralelos: ${DIGSA_ANALITICA_PARALELOS:2}                            # max_parallel_workers_per_gather
      cache-resultados: ${DIGSA_ANALITICA_CACHE_RESULTADOS:200}           # resultados en caché (mismo corte = mismo resultado)
      precalentar: ${DIGSA_ANALITICA_PRECALENTAR:true}                   # tableros por defecto del nuevo corte en segundo plano
    # --- Cohortes y alertas tempranas (A4, analitica-cohortes-alertas; PropiedadesRiesgo) ---
    riesgo:
      recalcular-al-aplicar: ${DIGSA_ANALITICA_RECALCULAR_RIESGO:true}  # cohortes y motor de alertas al aplicar cada cargue (en segundo plano)
      tiempo-maximo-minutos: ${DIGSA_ANALITICA_RIESGO_MINUTOS:30}         # statement_timeout de cada sentencia del recálculo
      memoria-trabajo-mb: ${DIGSA_ANALITICA_RIESGO_WORK_MEM_MB:256}       # work_mem del recálculo (orden de 2 M filas por paciente)
      por-pagina: 50                                                    # alertas por página en la consola
      cortes-con-membresia: ${DIGSA_ANALITICA_CORTES_MEMBRESIA:6}         # cortes por versión con la membresía (pacientes del periodo reproducibles)
      meses-gracia: ${DIGSA_ANALITICA_MESES_GRACIA:2}                     # meses sin dispensar que no cortan la membresía (ni dan ingreso ni salida)
      supresion-sensibles: ${DIGSA_ANALITICA_SUPRESION_SENSIBLES:5}       # k de las cohortes sensibles a nivel ESM (0 la apaga; duda AN de supresión)
      cohortes-sensibles: ${DIGSA_ANALITICA_COHORTES_SENSIBLES:vih,huerfanas}
      meses-aviso: ${DIGSA_ANALITICA_MESES_AVISO:3}                       # avisos por correo solo para alertas de los últimos N meses del corte
    # --- Predicción (A5, tablero 12; PropiedadesPrediccion) ---
    prediccion:
      entrenar-al-aplicar: ${DIGSA_ANALITICA_ENTRENAR_PREDICCION:true}  # nacional y por Fuerza al aplicar un cargue que completa un mes (segundo plano)
      horizonte: ${DIGSA_ANALITICA_HORIZONTE_PREDICCION:6}              # meses proyectados por defecto (6 a 24; A4 §11.1 f: mínimo 6)
      por-pagina: 20                                                    # entrenamientos por página en la bitácora del tablero
    # --- Exportación de los hechos por periodo (A7.2, duda AN.14; PropiedadesExportacionHechos) ---
    exportacion-hechos:
      vigencia-horas: ${DIGSA_ANALITICA_HECHOS_VIGENCIA_HORAS:24}         # luego se borran los archivos (datos de salud seudonimizados, Ley 1581)
      limite-minutos-mes: ${DIGSA_ANALITICA_HECHOS_LIMITE_MINUTOS:10}     # tope de cada mes (su propia transacción; AGS-75: 10 min)
      meses-max: ${DIGSA_ANALITICA_HECHOS_MESES_MAX:60}                   # meses por solicitud (todo el contrato y la entrega final)
      lote: 5000                                                          # filas por lote del cursor
      revision-ms: 60000                                                  # revisión de vencidas y pendientes

logging:
  level:
    root: INFO
