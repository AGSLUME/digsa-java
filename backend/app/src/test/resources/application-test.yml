# Pruebas de integración: PostgreSQL 16 real (embebido sin Docker por defecto; con Docker: -Dzonky.test.database.provider=docker)
zonky:
  test:
    database:
      provider: zonky
      type: postgres
      postgres:
        docker:
          image: postgres:16-alpine

digsa:
  url: http://localhost/
  entorno: local
  correo:
    modo: archivo
    carpeta: target/correos-prueba
  archivos:
    carpeta: target/archivos-prueba     # las evidencias y actas de las pruebas no quedan en el árbol fuente
  sms:
    modo: archivo                       # los SMS quedan en target/archivos-prueba/sms y en memoria (SmsArchivo.ultimos)
  # Las pruebas manejan a mano el respaldo de la bandeja y el monitor de salud (con el reloj movible); el envío inmediato sí corre
  salida:
    intervalo-ms: 3600000
    inicio-ms: 3600000
  salud:
    inicio-ms: 3600000
  captcha:
    clave-sitio: ""
    clave-secreta: ""
  reportes:
    correo-defecto: reportes@example.com
    dominios-permitidos: example.com
  # --- Analítica (rama analitica) ---
  analitica:
    clave-seudonimo: clave-de-prueba-no-secreta-para-el-hmac-del-paciente
    parte-max-mb: 1                     # partes de 1 MB: los archivos de prueba se suben en varias partes
    cuerpo-ws-max-mb: 1                 # lote del servicio web de más de 1 MB: 413
    abandono-cron: "-"                  # las pruebas corren el vencimiento y el borrado a mano
    borrado-cron: "-"
    tableros:
      precalentar: false                # sin hilo de fondo tras cada cargue: las pruebas miden y comparan la consulta misma

logging:
  level:
    co.com.agsamericas.digsa: INFO
