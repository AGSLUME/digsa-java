# Pruebas de integración: PostgreSQL 16 real (embebido sin Docker por defecto; con Docker: -Dzonky.test.database.provider=docker)
zonky:
  test:
    database:
      provider: zonky
      type: postgres
      postgres:
        docker:
          image: postgres:16-alpine

digsa:
  url: http://localhost/
  entorno: local
  correo:
    modo: archivo
    carpeta: target/correos-prueba
  archivos:
    carpeta: target/archivos-prueba     # las evidencias y actas de las pruebas no quedan en el árbol fuente
  sms:
    modo: archivo                       # los SMS quedan en target/archivos-prueba/sms y en memoria (SmsArchivo.ultimos)
  # Las pruebas manejan a mano el respaldo de la bandeja y el monitor de salud (con el reloj movible); el envío inmediato sí corre
  salida:
    intervalo-ms: 3600000
    inicio-ms: 3600000
  salud:
    inicio-ms: 3600000
  captcha:
    clave-sitio: ""
    clave-secreta: ""
  reportes:
    correo-defecto: reportes@example.com
    dominios-permitidos: example.com

logging:
  level:
    co.com.agsamericas.digsa: INFO
